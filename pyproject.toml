[project]
name = "py-jsrpc"
version = "0.2.0"
description = "轻量、协程异步的 WebSocket 远程调用服务：Python 侧调用浏览器注入的 js 执行结果"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "sanic>=25.3",
    "websockets>=14",
    "loguru>=0.7",
]

[project.scripts]
jsrpc-server = "jsrpc.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsrpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
